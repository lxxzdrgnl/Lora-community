name: Deploy Spring Boot to AWS & JCloud

on:
  push:
    branches:
      - main

jobs:
  # 공통 빌드 작업
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Gradle 캐싱
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Gradle로 빌드
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 6. JAR 파일 이름 통일
      - name: Rename JAR
        run: mv build/libs/*-SNAPSHOT.jar build/libs/application.jar

      # 7. 빌드 산출물 업로드
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/application.jar
          retention-days: 1

  # AWS Elastic Beanstalk 배포
  deploy-aws:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 1. 빌드 산출물 다운로드
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: build/libs

      # 2. Elastic Beanstalk에 배포
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ap-northeast-2
          application_name: Blueming-AI-env-1
          environment_name: Blueming-AI-env-1-env
          version_label: github-action-${{ github.sha }}
          deployment_package: build/libs/application.jar
          use_existing_version_if_available: false
          wait_for_deployment: true
          wait_for_environment_recovery: 60

  # JCloud 배포 (병렬 실행, Docker 기반)
  deploy-jcloud:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 체크아웃 (Dockerfile 필요)
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. 빌드 산출물 다운로드
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: build/libs

      # 3. SSH 키 설정
      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.JCLOUD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          # Secret이 비어있는지 확인
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: JCLOUD_SSH_KEY secret is not set or empty"
            echo "Please add your SSH private key to GitHub Secrets:"
            echo "1. Go to Settings > Secrets and variables > Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: JCLOUD_SSH_KEY"
            echo "4. Value: Your entire RSA private key (including -----BEGIN RSA PRIVATE KEY----- and -----END RSA PRIVATE KEY-----)"
            exit 1
          fi

          # SSH 키 파일 작성
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/jcloud_key.pem
          chmod 600 ~/.ssh/jcloud_key.pem

          # SSH 키 파일 확인
          echo "SSH key file created:"
          ls -la ~/.ssh/jcloud_key.pem
          echo "Key file size: $(wc -c < ~/.ssh/jcloud_key.pem) bytes"
          echo "Key begins with:"
          head -n 1 ~/.ssh/jcloud_key.pem
          echo "Key ends with:"
          tail -n 1 ~/.ssh/jcloud_key.pem

          # SSH 연결 테스트 (타임아웃 10초)
          echo "Testing SSH connection to 113.198.66.68:19232..."
          ssh-keyscan -p 19232 -T 10 113.198.66.68 >> ~/.ssh/known_hosts 2>&1 || echo "Warning: ssh-keyscan failed, continuing anyway"

          # 실제 SSH 연결 테스트
          ssh -i ~/.ssh/jcloud_key.pem -p 19232 -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@113.198.66.68 "echo 'SSH connection successful'" || {
            echo "❌ SSH connection failed. Check your SSH key and server accessibility."
            exit 1
          }

          echo "✅ SSH connection successful!"

      # 4. 소스 코드 및 JAR 파일을 JCloud로 전송
      - name: Transfer files to JCloud
        run: |
          echo "Creating deployment directory on server..."
          ssh -i ~/.ssh/jcloud_key.pem -p 19232 -o StrictHostKeyChecking=no ubuntu@113.198.66.68 "mkdir -p ~/app"

          echo "Transferring Dockerfile..."
          scp -i ~/.ssh/jcloud_key.pem -P 19232 -o StrictHostKeyChecking=no Dockerfile ubuntu@113.198.66.68:~/app/

          echo "Transferring application.jar..."
          scp -i ~/.ssh/jcloud_key.pem -P 19232 -o StrictHostKeyChecking=no build/libs/application.jar ubuntu@113.198.66.68:~/app/

      # 5. 배포 스크립트 생성
      - name: Create deployment script
        run: |
          echo '#!/bin/bash' > deploy.sh
          echo 'set -e' >> deploy.sh
          echo '' >> deploy.sh
          echo 'echo "🚀 Starting deployment..."' >> deploy.sh
          echo '' >> deploy.sh
          echo '# .env 파일 존재 확인' >> deploy.sh
          echo 'if [ ! -f ~/.env ]; then' >> deploy.sh
          echo '  echo "❌ Error: ~/.env file not found"' >> deploy.sh
          echo '  echo "Please create ~/.env file with environment variables"' >> deploy.sh
          echo '  exit 1' >> deploy.sh
          echo 'fi' >> deploy.sh
          echo '' >> deploy.sh
          echo '# 이전 컨테이너 중지 및 제거' >> deploy.sh
          echo 'echo "Stopping old container..."' >> deploy.sh
          echo 'sudo docker stop springboot-app 2>/dev/null || true' >> deploy.sh
          echo 'sudo docker rm springboot-app 2>/dev/null || true' >> deploy.sh
          echo 'sudo docker rmi springboot-app:latest 2>/dev/null || true' >> deploy.sh
          echo '' >> deploy.sh
          echo '# Docker 이미지 빌드' >> deploy.sh
          echo 'cd ~/app' >> deploy.sh
          echo 'echo "Building Docker image..."' >> deploy.sh
          echo 'echo "FROM eclipse-temurin:17-jre-alpine" > Dockerfile.simple' >> deploy.sh
          echo 'echo "WORKDIR /app" >> Dockerfile.simple' >> deploy.sh
          echo 'echo "COPY application.jar app.jar" >> Dockerfile.simple' >> deploy.sh
          echo 'echo "EXPOSE 5000" >> Dockerfile.simple' >> deploy.sh
          echo "echo 'ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]' >> Dockerfile.simple" >> deploy.sh
          echo '' >> deploy.sh
          echo 'sudo docker build -f Dockerfile.simple -t springboot-app:latest .' >> deploy.sh
          echo '' >> deploy.sh
          echo '# 컨테이너 실행' >> deploy.sh
          echo 'echo "Starting container..."' >> deploy.sh
          echo 'sudo docker run -d \' >> deploy.sh
          echo '  --name springboot-app \' >> deploy.sh
          echo '  --restart unless-stopped \' >> deploy.sh
          echo '  -p 17232:5000 \' >> deploy.sh
          echo '  --env-file ~/.env \' >> deploy.sh
          echo '  springboot-app:latest' >> deploy.sh
          echo '' >> deploy.sh
          echo '# 대기 및 상태 확인' >> deploy.sh
          echo 'echo "Waiting for container..."' >> deploy.sh
          echo 'sleep 10' >> deploy.sh
          echo 'sudo docker ps | grep springboot-app' >> deploy.sh
          echo 'echo "✅ Deployment completed!"' >> deploy.sh
          chmod +x deploy.sh

      # 6. 배포 스크립트 전송 및 실행
      - name: Deploy to JCloud
        run: |
          echo "Transferring deployment script..."
          scp -i ~/.ssh/jcloud_key.pem -P 19232 -o StrictHostKeyChecking=no deploy.sh ubuntu@113.198.66.68:~/app/

          echo "Executing deployment script..."
          ssh -i ~/.ssh/jcloud_key.pem -p 19232 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 ubuntu@113.198.66.68 "cd ~/app && ./deploy.sh"

          echo "✅ JCloud deployment completed!"
          echo "📌 Access: https://113.198.66.68:17232"

      # 7. SSH 키 파일 정리
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/jcloud_key.pem
