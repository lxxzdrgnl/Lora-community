name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Gradle로 빌드
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 5.JAR 파일 이름 통일
      # 버전(0.0.1)이 바뀌어도 스크립트 수정 없이 배포되도록 이름을 고정
      - name: Rename JAR
        run: mv build/libs/*-SNAPSHOT.jar build/libs/application.jar

      # 6. Elastic Beanstalk에 배포
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ap-northeast-2

          application_name: Blueming-AI-env-1
          environment_name: Blueming-AI-env-1-env
          
          version_label: github-action-${{ github.sha }}
          deployment_package: build/libs/application.jar
          use_existing_version_if_available: false
          wait_for_deployment: true
          wait_for_environment_recovery: 60
