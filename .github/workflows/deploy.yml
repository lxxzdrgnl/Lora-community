name: Deploy Spring Boot to Mini PC

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test
          mv build/libs/*-SNAPSHOT.jar build/libs/application.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/application.jar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: build/libs

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PC_SSH_KEY }}" > ~/.ssh/pc_key
          chmod 600 ~/.ssh/pc_key
          ssh-keyscan -H ${{ secrets.PC_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer files
        run: |
          ssh -i ~/.ssh/pc_key ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }} \
            "mkdir -p ~/blueming/backend"

          scp -i ~/.ssh/pc_key \
            build/libs/application.jar \
            ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }}:~/blueming/backend/application.jar

          scp -i ~/.ssh/pc_key \
            Dockerfile.runtime \
            ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }}:~/blueming/backend/Dockerfile.runtime

      - name: Deploy
        run: |
          ssh -i ~/.ssh/pc_key -o ServerAliveInterval=60 \
            ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }} << 'EOF'
            set -e
            cd ~/blueming
            docker compose up -d --build app --no-deps
            echo "✅ Deployed: $(docker ps --filter name=lora-app --format '{{.Names}} {{.Status}}')"
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/pc_key
