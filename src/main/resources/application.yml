spring:
  application:
    name: WSD_Lora_community

  # MySQL Database (기본 설정)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:loradb}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway 설정 (DB 마이그레이션) - 순환 의존성 문제로 비활성화
  flyway:
    enabled: false  # Flyway 비활성화 (JPA가 스키마 관리)

  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update  # Flyway 비활성화로 JPA가 스키마 관리
    defer-datasource-initialization: true  # JPA 테이블 생성 후 data.sql 실행
    properties:
      hibernate:
        format_sql: false  # SQL 포맷팅 비활성화 (로그 간결화)
        show_sql: false
        use_sql_comments: false
        highlight_sql: false  # SQL 하이라이트 비활성화 (ANSI 색상 코드 제거)
    show-sql: false
    open-in-view: false  # 멀티 인스턴스 환경에서 권장

  # SQL 초기화 설정
  sql:
    init:
      mode: never  # data.sql 실행 안 함 (이미 RDS에 데이터 있음)
      continue-on-error: false  # 에러 발생 시 중단

  # OAuth2 설정 (Google)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2MB

  # JSON 설정
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

  # Redis 설정 (Upstash Redis - Modal과 공유)
  data:
    redis:
      host: ${REDIS_HOST:super-gator-36826.upstash.io}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 3000
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 3000

# JWT 설정
jwt:
  secret: ${JWT_SECRET:wsd-lora-community-jwt-secret-key-2024-for-hs256-algorithm-minimum-256-bits-required}
  access-token-validity: 3600000    # 1시간 (밀리초
  refresh-token-validity: 604800000  # 7일 (밀리초)

# Frontend URL (OAuth2 콜백용)
frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

# Backend callback URL
app:
  callback-url: ${CALLBACK_URL:http://localhost:8080}

# FastAPI/Modal 연동 설정
fastapi:
  base-url: ${FASTAPI_URL:https://dldydwo9--lora-training-inference-fastapi-app.modal.run}
  url: ${FASTAPI_URL:https://dldydwo9--lora-training-inference-fastapi-app.modal.run}
  connect-timeout: 10000  # 10초
  read-timeout: 300000    # 5분 (학습/생성은 시간이 오래 걸림)

# Modal 멀티 인스턴스 설정
modal:
  enabled: ${MODAL_ENABLED:true}  # Modal 사용 여부 (개발: false, 프로덕션: true)
  app-url: ${MODAL_APP_URL:https://dldydwo9--lora-training-inference-fastapi-app.modal.run}
  instances:
    - ${MODAL_INSTANCE_1:http://127.0.0.1:8000}
    - ${MODAL_INSTANCE_2:http://127.0.0.1:8001}
    - ${MODAL_INSTANCE_3:http://127.0.0.1:8002}
  max-instances: ${MODAL_MAX_INSTANCES:10}
  health-check-interval: 300000  # 5분 (개발 환경에서는 더 긴 주기 권장)
  retry-attempts: 3
  load-balancing-strategy: LEAST_LOAD  # ROUND_ROBIN, LEAST_LOAD, PRIORITY

# 파일 저장 경로 (로컬 - 개발용, 나중에 S3로 전환)
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  static-url: ${FILE_STATIC_URL:http://localhost:8080/static}

# AWS S3 설정
aws:
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    buckets:
      training-data: ${AWS_S3_TRAINING_BUCKET:lora-training-data-bucket}  # 학습 데이터셋
      models: ${AWS_S3_MODELS_BUCKET:lora-models-bucket}                  # 학습된 모델 파일
      generated-images: ${AWS_S3_GENERATED_BUCKET:lora-generated-image-bucket}  # 생성된 이미지
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:your-access-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:your-secret-key}

# 페이징 기본 설정
pagination:
  default-page-size: 20
  max-page-size: 100

# CORS 설정 (멀티 인스턴스 고려)
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,${CORS_ORIGINS:}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Swagger 설정
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 서버 설정
server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# 로깅 설정
logging:
  level:
    root: WARN
    rheon.wsd_lora_community: INFO
    org.springframework.web: ERROR
    org.springframework.security: ERROR
    org.springframework.web.servlet.resource.ResourceHttpRequestHandler: OFF  # 404 정적 리소스 에러 숨김
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: OFF  # 예외 핸들러 로그 숨김
    org.hibernate: ERROR
    org.hibernate.SQL: OFF
    org.hibernate.type: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    com.zaxxer.hikari: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  exception-conversion-word: "%nopex"  # 스택트레이스 완전히 숨김

# 멀티 인스턴스 환경 고려사항
# - 세션 사용 안 함 (JWT 기반 Stateless)
# - 파일 저장은 S3 사용 (프로덕션)
# - 좋아요/조회수는 DB에 직접 저장
# - SSE 연결은 각 인스턴스별 관리
