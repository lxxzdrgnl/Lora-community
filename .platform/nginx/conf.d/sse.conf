# SSE (Server-Sent Events) configuration for long-running connections
# 이미지 생성 및 학습은 2분 이상 걸리므로 타임아웃을 10분으로 설정

location /api/generate/stream {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;

    # SSE는 응답이 천천히 오므로 타임아웃을 길게 설정 (10분)
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # SSE는 버퍼링하면 안 됨 (실시간 스트리밍)
    proxy_buffering off;
    proxy_cache off;

    # Keep-alive 연결 유지
    proxy_set_header Connection '';
    chunked_transfer_encoding off;

    # 일반 헤더
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/training/stream {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;

    # 학습도 긴 시간이 소요되므로 타임아웃을 길게 설정 (10분)
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # SSE는 버퍼링하면 안 됨
    proxy_buffering off;
    proxy_cache off;

    # Keep-alive 연결 유지
    proxy_set_header Connection '';
    chunked_transfer_encoding off;

    # 일반 헤더
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
